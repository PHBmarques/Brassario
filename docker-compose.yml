
services:
  db:
    image: postgres:16
    container_name: brassario-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"   
    volumes:
      - brassario-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: brassario-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"   
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"     # pgAdmin: http://localhost:5050
    volumes:
      - brassario-pgadmin-data:/var/lib/pgadmin

  backend:
    build:
      context: ./backend
      dockerfile: Brassario.Api/Dockerfile
    container_name: brassario-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-brassario}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES:-30}
      Email__Host: ${EMAIL_HOST:-mailpit}
      Email__Port: ${EMAIL_PORT:-1025}
      Email__From: ${EMAIL_FROM:-no-reply@brassario.local}
      TZ: America/Sao_Paulo
    ports:
      - "5000:8080"   # Swagger: http://localhost:5000/swagger

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brassario-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"     # Aplicação: http://localhost:3000
  mailpit:
    image: axllent/mailpit:latest
    container_name: brassario-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Caixa de entrada: http://localhost:8025

volumes:
  brassario-db-data:
  brassario-pgadmin-data: